services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cardrex
      POSTGRES_PASSWORD: cardrex_dev
      POSTGRES_DB: cardrex
    ports: ['5432:5432']
    volumes: [cardrex_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cardrex']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cardrex_postgres:
